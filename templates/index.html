<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Social Media Scanner</title>
    <style>
        body, html {
    margin: 0;
    padding: 0;
    font-family: monospace;
    color: #00ff00;
    background: black;
    overflow: hidden;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

.container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding-top: 100px;
}

input, button {
    padding: 10px;
    background: black;
    border: 1px solid #00ff00;
    color: #00ff00;
    margin: 10px;
}

.result {
    background-color: rgba(0, 0, 0, 0.7);
    padding: 15px;
    border: 1px solid #00ff00;
    display: inline-block;
    margin-top: 20px;
}

    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <div class="container">
        <h1>🔍 Social Media Account Scanner</h1>
        <form method="POST">
            <input type="text" name="user_input" placeholder="Enter username or link" required>
            <button type="submit">Scan</button>
        </form>

        {% if result %}
        <div class="result">
            <h2>Result:</h2>
            <p><strong>Name:</strong> {{ result.name }}</p>
            <p><strong>Username:</strong> {{ result.username }}</p>
            <p><strong>Total Posts:</strong> {{ result.posts }}</p>
            <p><strong>Violating Posts:</strong> {{ result.illegal_posts }}</p>
            <p><strong>Violation Type:</strong> {{ result.violation_type }}</p>
        </div>
        {% endif %}
    </div>

    <script >
        const canvas = document.getElementById("matrixCanvas");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const chars = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = Array.from({ length: columns }).fill(1);

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#0F0";
    ctx.font = `${fontSize}px monospace`;

    for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height || Math.random() > 0.95) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}

setInterval(drawMatrix, 33);

    </script>
</body>
</html>
